name: Java CI (library + gmui)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11', cache: gradle }
      - uses: gradle/actions/setup-gradle@v3
      
      - name: Build library (with tests and javadoc)
        working-directory: cadc-gmui-server
        run: ../gradlew -i clean build javadoc
        
      - name: Build gmui application
        working-directory: gmui  
        run: ../gradlew clean build
        
      - name: Build docker image
        working-directory: gmui
        run: docker build -t gmui:local .