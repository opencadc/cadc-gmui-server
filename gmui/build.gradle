import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'war'

    // IntelliJ IDEA plugin here to allow integration tests to appear properly in IDEs.
    id 'idea'
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url = 'https://maven.restlet.talend.com'
    }
}

dependencies {
    implementation 'org.restlet.jee:org.restlet:[2.4.3, 2.4.99)'
    implementation 'org.restlet.jee:org.restlet.ext.freemarker:[2.4.3, 2.4.99)'
    implementation 'org.restlet.jee:org.restlet.ext.json:[2.4.3, 2.4.99)'
    implementation 'org.restlet.jee:org.restlet.ext.servlet:[2.4.3, 2.4.99)'
    implementation 'org.restlet.jee:org.restlet.ext.spring:[2.4.3, 2.4.99)'

    // Address critical security issues in transient dependency of commons-configuration2.
    implementation 'org.apache.commons:commons-configuration2:2.10.1'

//    implementation 'org.opencadc:cadc-access-control-identity:[1.1.0, 2.0)'
    implementation 'org.opencadc:cadc-access-control:[1.1.29, 2.0)'
    implementation 'org.opencadc:cadc-dali:[1.2.25, 1.3)'
    implementation 'org.opencadc:cadc-log:[1.1.5, 1.2.0)'
    implementation 'org.opencadc:cadc-registry:[1.8.0, 1.9.0)'
    implementation 'org.opencadc:cadc-util:[1.6, 2.0)'
    implementation 'org.opencadc:cadc-web-util:[1.2.10,)'

    implementation 'org.springframework:spring-beans:[5.3.18, 5.4.0)'
    implementation 'org.springframework:spring-context:[5.3.18, 5.4.0)'
    implementation 'org.springframework:spring-web:[5.3.18, 5.4.0)'
    implementation 'org.springframework:spring-jdbc:[5.3.18, 5.4.0)'
    implementation 'org.springframework:spring-tx:[5.3.18, 5.4.0)'

//    runtimeOnly 'org.bouncycastle:bcprov-jdk15on:1.46'
    runtimeOnly 'javax.servlet.jsp.jstl:jstl-api:1.2'
    runtimeOnly 'javax.servlet:jstl:1.2'

    providedCompile 'javax.servlet:javax.servlet-api:3.1.0'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.skyscreamer:jsonassert:1.5.3'
    testImplementation 'org.easymock:easymock:[4.3,5.0)'
    testImplementation 'org.apache.commons:commons-text:1.13.1'
    testImplementation 'org.opencadc:cadc-web-test:[2.1.3,3.0)'
    testImplementation 'org.seleniumhq.selenium:selenium-java:[3.14,4.0)'

}

sourceCompatibility = '11'

war {
    // Trying to fix static file caching on new build.
    eachFile {
        if (it.name.endsWith('.jsp')) {
            filter(ReplaceTokens, tokens: [version: project.version])
        }

        if (it.name.equals('index.jsp')) {
            filter(ReplaceTokens, tokens: ['LastChangedDate': getDate()])
        }
    }
    archiveName = 'gmui.war'

    // Include the swagger-ui so that /cavern provides the VOSpace API documentation
    from(System.getenv('RPS') + '/resources/') {
        include 'swagger-ui/'
    }

    from('.') {
        include 'VERSION'
    }
}

static def getDate() {
    new Date().format('yyyy-MM-dd')
}

sourceSets {
    intTest
}
configurations {
    intTestImplementation
    intTestImplementation.extendsFrom(testImplementation)
    intTestImplementation.canBeResolved = true
}
idea {
    module {
        //and some extra test source dirs
        testSourceDirs += file('src/intTest/java')
        scopes.TEST.plus += [configurations.intTestImplementation]
    }
}

['firefox', 'chrome'].each { driver ->
    task "intTest${driver.capitalize()}"(type: Test) { driverTest ->
        testClassesDirs = sourceSets.intTest.output.classesDirs
        classpath = sourceSets.intTest.runtimeClasspath
        reports {
            html.destination = reporting.file("$name/html")
        }
        dependencies {
            intTestImplementation 'junit:junit:[4.12,5.0)'
            intTestImplementation 'org.apache.commons:commons-text:1.3'
            intTestImplementation 'org.opencadc:cadc-web-test:[2.0,)'
            intTestImplementation 'org.seleniumhq.selenium:selenium-java:[3.14,4.0)'
        }
        systemProperty "driver", "${driver}"
        if (project.hasProperty('intTest_selenium_server_url')) {
            systemProperty 'selenium.server.url', project.intTest_selenium_server_url
            logger.info('Running browser tests on ' + project.intTest_selenium_server_url)
        } else {
            systemProperty 'selenium.server.url', 'http://cadcint2.cadc.dao.nrc.ca:3444'
        }
        if (!project.hasProperty('intTest_web_app_url')) {
            System.err.println("Please set the target URL (-PintTest_web_app_url=https://...)")
        } else {
            systemProperty 'web.app.url', project.intTest_web_app_url
        }
        if (!project.hasProperty('intTest_user_name')) {
            System.err.println("Please set the target user (-PintTest_user_name=someusername)")
        } else {
            systemProperty 'user.name', project.intTest_user_name
        }
        if (!project.hasProperty('intTest_user_password')) {
            System.err.println("Please set the target user's password (-PintTest_user_password=123pass456)")
        } else {
            systemProperty 'user.password', project.intTest_user_password
        }
        maxParallelForks = 1
    }
}

